# Rewrites index.json after games or protocols change on main, so Lookout downloads what was merged, and when Lookout
# has a newer release, so Lookout can tell its users.
name: Index

on:
  push:
    branches: [ main ]
    paths: [ "games/**", "protocols/**", "tools/make-index.py", ".github/workflows/index.yml" ]
  # Lookout's release steps start it by hand; the daily run catches a release they did not.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: index

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      # The newest main, not the commit that started the run: a run that waited behind another would miss that one's
      # index commit, and its own push would be refused.
      # The whole history: the index names the last commit that changed the games or protocols.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Write the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo molycode/lookout --json tagName --jq .tagName)"
          python3 tools/make-index.py --lookout-version "${latest#v}"
      # A push made with the workflow's own token starts no workflow, so this commit does not run it again.
      - name: Commit the index
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --message "Index for $(git log -1 --format=%h -- games protocols)" -- index.json
            # A merge landing after the checkout refuses the push. The index still holds on top of it: it names its commit.
            git push || { git pull --rebase origin main && git push; }
          fi
