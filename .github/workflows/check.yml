# Checks every game and protocol with the latest Lookout release, as `lookout --check` does on a contributor's machine.
name: Check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # A pull request is checked out as its merge commit; two deep reaches the base it merges into.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Lookout trusts the index's commit and checksums, and raw.githubusercontent.com would serve a merged one for
      # minutes before the Index workflow replaces it.
      - name: Leave index.json to the Index workflow
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- index.json; then
            echo "::error file=index.json::index.json is written by the Index workflow after a merge; leave it out of the pull request."
            exit 1
          fi
      - name: Get the latest Lookout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo molycode/lookout --pattern "lookout-*-x86_64.tar.xz" --dir "$RUNNER_TEMP/lookout"
          tar -xJf "$RUNNER_TEMP"/lookout/lookout-*-x86_64.tar.xz -C "$RUNNER_TEMP/lookout"
      - name: Check the games and protocols
        run: |
          lookout="$(find "$RUNNER_TEMP/lookout" -type f -name lookout -perm -u+x | head -n 1)"

          if ! "$lookout" --help | grep -q -- "--check"; then
            echo "::notice::The latest Lookout release cannot check games yet (it needs 1.2 or newer), so nothing was checked."
            exit 0
          fi

          "$lookout" --check .
